[package]
name = "memo-miner"
version = "0.4.2"
edition = "2021"
description = "Terminal miner for MEMO on X1: manual and automatic mints with a Solana CLI wallet"
license = "MIT"
repository = "https://github.com/xenartist/memo-miner"
readme = "README.md"

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false }
base64 = "0.22"
bincode = "1.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
futures = "0.3"
memo-sdk = { git = "https://github.com/xenartist/memo-sdk", tag = "v0.1.0" }
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
solana-hash = "2.3"
solana-instruction = "2.3"
solana-keypair = "2.2"
solana-message = "2.4"
solana-pubkey = { version = "2.4", features = ["curve25519"] }
solana-signer = "2.2"
solana-system-interface = { version = "1.0", features = ["bincode"] }
solana-transaction = { version = "2.2", features = ["bincode"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
