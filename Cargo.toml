[package]
name = "memo-miner"
version = "0.1.0"
edition = "2021"
description = "Terminal miner for MEMO on X1: manual and automatic mints with a Solana CLI wallet"
license = "MIT"
repository = "https://github.com/xenartist/memo-miner"
readme = "README.md"

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false }
base64 = "0.22"
bincode = "1.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
futures = "0.3"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
solana-sdk = "2.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
