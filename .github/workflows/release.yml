name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # solana-keygen from the official Solana CLI (Anza), shipped next to memo-miner
  KEYGEN_VERSION: 4.3.2

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Build solana-keygen
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libudev-dev
          fi
          cargo install solana-keygen --version "=$KEYGEN_VERSION" --locked --target ${{ matrix.target }} --root keygen
          curl -sSfL "https://raw.githubusercontent.com/anza-xyz/agave/v$KEYGEN_VERSION/LICENSE" -o LICENSE-solana-keygen
      - name: Package
        shell: bash
        run: |
          name=memo-miner-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp README.md LICENSE LICENSE-solana-keygen "$name"/
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/memo-miner.exe keygen/bin/solana-keygen.exe "$name"/
            7z a "$name.zip" "$name"
          else
            cp target/${{ matrix.target }}/release/memo-miner keygen/bin/solana-keygen "$name"/
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: memo-miner-*.*
